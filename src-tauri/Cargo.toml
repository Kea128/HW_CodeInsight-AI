[package]
name = "codeinsight-ai"
version = "0.1.8"
description = "CodeInsight-AI desktop host"
authors = ["CodeInsight-AI contributors"]
edition = "2021"

[lib]
name = "codeinsight_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
