name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release channel and versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne "Kea128/HW_CodeInsight-AI") {
            throw "Desktop releases must run from Kea128/HW_CodeInsight-AI"
          }
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (
            Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"'
          ).Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "package.json, tauri.conf.json and Cargo.toml versions must match"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "desktop-v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop-v$packageVersion"
          }

      - name: Install frontend and desktop tooling
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@latest
          npm run tauri icon desktop-ui/icon.svg

      - name: Install and freeze the analysis daemon
        run: |
          python -m pip install poetry
          poetry install -C api --no-interaction
          poetry -C api run python -m pip install pyinstaller
          poetry -C api run python -c "import keyring; import paramiko; import uvicorn; import api.main; print('Backend imports verified')"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $parts = $version.Split(".")
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              prodvers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'CodeInsight-AI'),
                StringStruct('FileDescription', 'CodeInsight analysis daemon'),
                StringStruct('FileVersion', '$version'),
                StringStruct('ProductName', 'CodeInsight-AI'),
                StringStruct('ProductVersion', '$version')
              ])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content api/daemon-version.txt -Encoding UTF8
          poetry -C api run python -m PyInstaller --noconfirm --clean --onefile --windowed --name codeinsight-daemon --version-file daemon-version.txt --paths .. --collect-all uvicorn --collect-all tiktoken --collect-submodules tiktoken_ext --collect-all adalflow --collect-all paramiko --collect-all keyring --collect-submodules keyring.backends --copy-metadata keyring --add-data "config;api/config" daemon.py
          New-Item -ItemType Directory -Force src-tauri/binaries
          Copy-Item api/dist/codeinsight-daemon.exe src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe

      - name: Run backend regression tests
        run: |
          poetry -C api run pytest ../tests/backend -q

      - name: Smoke test frozen daemon
        shell: pwsh
        run: |
          $env:CODEINSIGHT_DESKTOP_TOKEN = "desktop-ci-token"
          $daemon = Resolve-Path "src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe"
          $process = Start-Process -FilePath $daemon -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8001/health" -Headers @{
                  "X-CodeInsight-Token" = "desktop-ci-token"
                } -TimeoutSec 2
                if ($health.status -in @("ok", "healthy")) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "Frozen daemon did not become healthy within 60 seconds"
            }
            Invoke-RestMethod -Uri "http://127.0.0.1:8001/remote/projects" -Headers @{
              "X-CodeInsight-Token" = "desktop-ci-token"
            } -TimeoutSec 5 | Out-Null
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Validate desktop assets
        run: |
          npm run desktop:prepare
          node --check desktop-ui/app.js
          node --check desktop-ui/terminal-ui.js
          if (-not (Test-Path "src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe")) {
            throw "Desktop sidecar is missing"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Desktop icon is missing"
          }

      - name: Validate desktop host
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml
          $output = & cargo check --manifest-path src-tauri/Cargo.toml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            $tail = (($output | Select-Object -Last 120) -join "`n") -replace "$([char]27)\[[0-9;]*m", ""
            $annotation = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Desktop host compilation failed::$annotation"
            exit $exitCode
          }
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "CodeInsight-AI Desktop v__VERSION__"
          releaseBody: "Windows desktop release with startup recovery, redesigned Ubuntu workflow, secure embedded terminal, reliable persistent tasks, and stronger local AI setup."
          releaseDraft: false
          prerelease: false
