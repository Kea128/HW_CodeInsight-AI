name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend and desktop tooling
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@latest
          npm run tauri icon desktop-ui/icon.svg

      - name: Install and freeze the analysis daemon
        run: |
          python -m pip install poetry
          poetry install -C api --no-interaction
          poetry -C api run python -m pip install pyinstaller
          poetry -C api run python -c "import keyring; import paramiko; import uvicorn; import api.main; print('Backend imports verified')"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $parts = $version.Split(".")
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              prodvers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'CodeInsight-AI'),
                StringStruct('FileDescription', 'CodeInsight analysis daemon'),
                StringStruct('FileVersion', '$version'),
                StringStruct('ProductName', 'CodeInsight-AI'),
                StringStruct('ProductVersion', '$version')
              ])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content api/daemon-version.txt -Encoding UTF8
          poetry -C api run python -m PyInstaller --noconfirm --clean --onefile --windowed --name codeinsight-daemon --version-file daemon-version.txt --paths .. --collect-all uvicorn --collect-all tiktoken --collect-submodules tiktoken_ext --collect-all adalflow --collect-all paramiko --collect-all keyring --collect-submodules keyring.backends --copy-metadata keyring --add-data "config;api/config" daemon.py
          New-Item -ItemType Directory -Force src-tauri/binaries
          Copy-Item api/dist/codeinsight-daemon.exe src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe

      - name: Validate desktop host
        shell: pwsh
        run: |
          $output = & cargo check --manifest-path src-tauri/Cargo.toml 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            $annotation = ($output -join "`n").Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Desktop host compilation failed::$annotation"
            exit $exitCode
          }

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "CodeInsight-AI Desktop v__VERSION__"
          releaseBody: "Windows desktop preview with persistent tasks, recovery, file watching, night analysis, and signed online updates."
          releaseDraft: false
          prerelease: false
