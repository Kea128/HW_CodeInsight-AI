name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  freeze:
    name: Freeze daemon
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release channel and versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne "Kea128/HW_CodeInsight-AI") {
            throw "Desktop releases must run from Kea128/HW_CodeInsight-AI"
          }
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (
            Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"'
          ).Matches[0].Groups[1].Value
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion) {
            throw "package.json, tauri.conf.json and Cargo.toml versions must match"
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "desktop-v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop-v$packageVersion"
          }

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: api/.venv
          key: win-poetry-py311-${{ hashFiles('api/poetry.lock') }}
          restore-keys: |
            win-poetry-py311-

      - name: Install and freeze the analysis daemon
        shell: pwsh
        run: |
          poetry install -C api --no-interaction
          poetry -C api run python -m pip install --disable-pip-version-check pyinstaller
          $encodingCacheKey = "9b5ad71b2ce5302211f9c61530b329a4922fc6a4"
          $encodingPath = "api/tiktoken-cache/$encodingCacheKey"
          if (-not (Test-Path $encodingPath)) {
            throw "Vendored tiktoken encoding is missing: $encodingPath"
          }
          $encodingHash = (Get-FileHash $encodingPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($encodingHash -ne "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7") {
            throw "Bundled tiktoken encoding hash mismatch: $encodingHash"
          }
          poetry -C api run python -c "import keyring; import paramiko; import uvicorn; import api.main; print('Backend imports verified')"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $parts = $version.Split(".")
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              prodvers=($($parts[0]), $($parts[1]), $($parts[2]), 0),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)
            ),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'CodeInsight-AI'),
                StringStruct('FileDescription', 'CodeInsight analysis daemon'),
                StringStruct('FileVersion', '$version'),
                StringStruct('ProductName', 'CodeInsight-AI'),
                StringStruct('ProductVersion', '$version')
              ])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content api/daemon-version.txt -Encoding UTF8
          poetry -C api run python -m PyInstaller --noconfirm --onefile --windowed --name codeinsight-daemon --version-file daemon-version.txt --paths .. --collect-all uvicorn --collect-all tiktoken --collect-submodules tiktoken_ext --collect-all adalflow --collect-all paramiko --collect-all keyring --collect-submodules keyring.backends --copy-metadata keyring --collect-all certifi --add-data "config;api/config" --add-data "tiktoken-cache;tiktoken_cache" daemon.py
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item api/dist/codeinsight-daemon.exe src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe

      - name: Pre-release verification
        shell: pwsh
        run: ./scripts/verify-release.ps1 -SkipRust

      - name: Smoke test frozen daemon
        shell: pwsh
        run: |
          $env:CODEINSIGHT_DESKTOP_TOKEN = "desktop-ci-token"
          $env:CODEINSIGHT_DESKTOP_VERSION = (Get-Content package.json | ConvertFrom-Json).version
          $env:HTTP_PROXY = "http://127.0.0.1:9"
          $env:HTTPS_PROXY = "http://127.0.0.1:9"
          $env:NO_PROXY = "127.0.0.1,localhost"
          $daemon = Resolve-Path "src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe"
          $process = Start-Process -FilePath $daemon -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8001/health" -Headers @{
                  "X-CodeInsight-Token" = "desktop-ci-token"
                } -TimeoutSec 2
                if ($health.status -in @("ok", "healthy")) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              $daemonLog = Join-Path $env:LOCALAPPDATA "CodeInsight-AI/daemon.log"
              if (Test-Path $daemonLog) { Get-Content $daemonLog -Tail 80 | Write-Output }
              throw "Frozen daemon did not become healthy within 60 seconds"
            }
            Invoke-RestMethod -Uri "http://127.0.0.1:8001/remote/projects" -Headers @{
              "X-CodeInsight-Token" = "desktop-ci-token"
            } -TimeoutSec 5 | Out-Null
            $daemonLog = Join-Path $env:LOCALAPPDATA "CodeInsight-AI/daemon.log"
            $daemonLogContent = if (Test-Path $daemonLog) { Get-Content $daemonLog -Raw } else { "" }
            if ($daemonLogContent -notmatch "using bundled tiktoken cache") {
              throw "Frozen daemon did not activate its bundled tiktoken cache"
            }
            if ($daemonLogContent -notmatch "desktop engine version: $env:CODEINSIGHT_DESKTOP_VERSION") {
              throw "Frozen daemon did not report the packaged desktop version"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: codeinsight-daemon-windows
          path: src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 1

  host-check:
    name: Check desktop host
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-windows
          add-job-id-key: false
          cache-on-failure: true

      - name: Lint and test desktop host
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $sidecar = "src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            New-Item -ItemType File -Force -Path $sidecar | Out-Null
          }
          cargo test --release --manifest-path src-tauri/Cargo.toml

  publish:
    name: Sign and publish
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [freeze, host-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: desktop-windows
          add-job-id-key: false
          cache-on-failure: true

      - name: Install desktop build tooling
        run: npm install --no-save --no-audit --no-fund @tauri-apps/cli@2 @xterm/xterm@6.0.0 @xterm/addon-fit@0.11.0

      - uses: actions/download-artifact@v4
        with:
          name: codeinsight-daemon-windows
          path: src-tauri/binaries

      - name: Validate desktop assets
        shell: pwsh
        run: |
          node scripts/prepare-desktop.mjs
          node --check desktop-ui/app.js
          node --check desktop-ui/terminal-ui.js
          if (-not (Test-Path "src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe")) {
            throw "Desktop sidecar is missing"
          }
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            throw "Desktop icon is missing"
          }

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "CodeInsight-AI Desktop v__VERSION__"
          releaseBody: "Hotfix: verify the Ubuntu SSH login before saving a remote project, always re-probe the live host fingerprint, and keep connection errors on the add-project form."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
