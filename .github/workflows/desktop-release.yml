name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend and desktop tooling
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@latest
          npm run tauri icon desktop-ui/icon.svg

      - name: Install and freeze the analysis daemon
        run: |
          python -m pip install poetry
          poetry install -C api --no-interaction
          poetry -C api run python -m pip install pyinstaller
          poetry -C api run python -c "import uvicorn; import api.main; print('Backend imports verified')"
          poetry -C api run python -m PyInstaller --noconfirm --clean --onefile --windowed --name codeinsight-daemon --paths .. --collect-all uvicorn --add-data "config;api/config" daemon.py
          New-Item -ItemType Directory -Force src-tauri/binaries
          Copy-Item api/dist/codeinsight-daemon.exe src-tauri/binaries/codeinsight-daemon-x86_64-pc-windows-msvc.exe

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "CodeInsight-AI Desktop v__VERSION__"
          releaseBody: "Windows desktop preview with persistent tasks, recovery, file watching, night analysis, and signed online updates."
          releaseDraft: false
          prerelease: false
